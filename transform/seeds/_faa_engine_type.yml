version: 2

seeds:
  - name: faa_engine_type
    description: >
      One row per decoded engine type code with descriptive context
      from https://registry.faa.gov/database/ardata.pdf.

    config:
      meta:
        last_updated_on: '2026-11-21'

    columns:
      - name: engine_type_code
        description: Engine type code.
        data_tests:
          - unique
          - not_null

      - name: description
        description: Engine type code description.
        data_tests:
          - not_null