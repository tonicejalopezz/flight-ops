version: 2

seeds:
  - name: faa_weight_class
    description: >
      One row per decoded weight class with descriptive context
      from https://registry.faa.gov/database/ardata.pdf.

    config:
      meta:
        last_updated_on: '2026-11-21'

    columns:
      - name: weight_class
        description: Weight class code.
        data_tests:
          - unique
          - not_null

      - name: description
        description: Weight class code description.
        data_tests:
          - not_null