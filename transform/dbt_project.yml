name: flight_ops
version: '1.0.0'
config-version: 2

profile: flight_ops

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  flight_ops:
    +schema: raw

    faa_aircraft_type:
      +column_types:
        aircraft_type_code: varchar

    faa_engine_type:
      +column_types:
        engine_type_code: varchar

    faa_landing_surface_code:
      +column_types:
        landing_surface_code: varchar

    faa_status_code:
      +column_types:
        status_code: varchar

    faa_weight_class:
      +column_types:
        weight_class: varchar

models:
  flight_ops:

    staging: 
      +materialized: view
      +schema: staging

    intermediate: 
      +materialized: view
      +schema: intermediate

    marts: 
      +materialized: view
      +schema: analytics 